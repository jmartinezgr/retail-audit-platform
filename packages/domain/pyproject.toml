[project]
name = "auditlake-domain"
version = "0.1.0"
description = "AuditLake's pure domain layer - pipeline, rule engine, synthetic generator. No I/O, no framework dependencies."
requires-python = ">=3.11"
dependencies = [
    "polars==1.44.1",
    "fastexcel==0.21.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "xlsxwriter==3.2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
